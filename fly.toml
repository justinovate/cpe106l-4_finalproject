# fly.toml app configuration file for MapuaQ
app = "mapuaq-registrar-queue"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "5000"
  DB_NAME = "/data/students_queue.db"
  EMAIL_DEV_MODE = "True"

[mounts]
  source = "mapuaq_data"
  destination = "/data"

[[services]]
  protocol = "tcp"
  internal_port = 5000

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20
