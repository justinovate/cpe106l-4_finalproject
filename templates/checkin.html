<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapuaQ - Student Priority Check-In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bg-mapua-cardinal { background-color: #800000; }
        .text-mapua-cardinal { color: #800000; }
        .btn-mapua-cardinal { background-color: #800000; color: white; border: none; }
        .btn-mapua-cardinal:hover { background-color: #600000; color: white; }
    </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-mapua-cardinal shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">MapuaQ <span class="badge bg-warning text-dark fs-6">Registrar Priority</span></a>
        <div class="navbar-nav">
            <a class="nav-link active" href="/">Student Check-In</a>
            <a class="nav-link" href="/dashboard">Queue Monitor</a>
            <a class="nav-link" href="/analytics">Analytics</a>
        </div>
    </div>
</nav>

<div class="container py-5" style="max-width: 600px;">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-mapua-cardinal text-white text-center py-3">
            <h4 class="mb-0 fw-bold">Mapúa Registrar Smart Check-In</h4>
            <small class="text-light opacity-75">Algorithmic Priority Scheduling System</small>
        </div>
        <div class="card-body p-4">
            {% if success %}
            <div class="alert alert-success d-flex align-items-center" role="alert">
                <div>
                    <strong>Ticket Issued!</strong> Welcome, {{ name }}. You have been placed into the priority queue.
                </div>
            </div>
            {% endif %}
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Student ID Number</label>
                    <input type="text" name="student_id" class="form-control" placeholder="e.g. 2024101234" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Full Name</label>
                    <input type="text" name="full_name" class="form-control" placeholder="e.g. Juan Dela Cruz" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Request Type</label>
                    <select name="request_type" class="form-select" required>
                        <option value="Graduation Clearance / Drop Deadline">Graduation Clearance / Drop Deadline (Urgency W=1)</option>
                        <option value="Prerequisite Override / Grade Dispute">Prerequisite Override / Grade Dispute (Urgency W=3)</option>
                        <option value="Transcript (TOR) Pickup">Official Transcript (TOR) Pickup (Urgency W=6)</option>
                        <option value="Certificate of Enrollment / Inquiry">Certificate of Enrollment / Inquiry (Urgency W=9)</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Academic Year Level</label>
                    <select name="grade_level" class="form-select" required>
                        <option value="Graduating Senior">Graduating Senior (Standing W=1)</option>
                        <option value="Non-Graduating Senior">Senior (Standing W=3)</option>
                        <option value="Junior">Junior (Standing W=5)</option>
                        <option value="Sophomore">Sophomore (Standing W=7)</option>
                        <option value="Freshman">Freshman (Standing W=9)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-mapua-cardinal w-100 py-2 fw-bold shadow-sm">Submit Check-In Ticket</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
