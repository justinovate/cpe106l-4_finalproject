<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapuaQ - Student Priority Check-In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bg-mapua-cardinal { background-color: #800000; }
        .text-mapua-cardinal { color: #800000; }
        .btn-mapua-cardinal { background-color: #800000; color: white; border: none; }
        .btn-mapua-cardinal:hover { background-color: #600000; color: white; }
    </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-mapua-cardinal shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">MapuaQ <span class="badge bg-warning text-dark fs-6 ms-1">Student Kiosk</span></a>
        <div class="navbar-nav">
            <a class="nav-link active" href="/checkin">Student Check-In</a>
            <a class="nav-link" href="/login">Employee Portal</a>
        </div>
    </div>
</nav>

<div class="container py-5" style="max-width: 600px;">
    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-header bg-mapua-cardinal text-white text-center py-3">
            <h4 class="mb-0 fw-bold">Mapúa Registrar Smart Check-In</h4>
            <small class="text-light opacity-75">Priority Queue Check-In Kiosk</small>
        </div>
        <div class="card-body p-4">
            <form method="POST" action="/checkin">
                <div class="mb-3">
                    <label class="form-label fw-bold">Student ID Number</label>
                    <input type="text" name="student_id" class="form-control" placeholder="e.g. 2024101234" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Full Name</label>
                    <input type="text" name="full_name" class="form-control" placeholder="e.g. Juan Dela Cruz" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Request Type</label>
                    <select name="request_type" class="form-select" required>
                        <optgroup label="Priority Tier 1 (Urgency W-1)">
                            <option value="Application for Graduation">Application for Graduation (W-1)</option>
                            <option value="Certificate for Graduation">Certificate for Graduation (W-1)</option>
                        </optgroup>
                        <optgroup label="Priority Tier 2 (Urgency W-2)">
                            <option value="Course Completion">Course Completion (W-2)</option>
                            <option value="Overload / Waiver">Overload / Waiver (W-2)</option>
                            <option value="Prerequisite-related Requests / Course Crediting">Prerequisite-related Requests / Course Crediting (W-2)</option>
                        </optgroup>
                        <optgroup label="Priority Tier 3 (Urgency W-3)">
                            <option value="Cancellation or Withdrawal of Enrollment">Cancellation or Withdrawal of Enrollment (W-3)</option>
                            <option value="Leave of Absence (LOA)">Leave of Absence (LOA) (W-3)</option>
                        </optgroup>
                        <optgroup label="Priority Tier 4 (Urgency W-4)">
                            <option value="Transcript of Records (TOR)">Transcript of Records (TOR) (W-4)</option>
                            <option value="Program Shifting or Specialization">Program Shifting or Specialization (W-4)</option>
                        </optgroup>
                        <optgroup label="Priority Tier 5 (Urgency W-5)">
                            <option value="Transfer Credentials (Honorable Dismissal)">Transfer Credentials (Honorable Dismissal) (W-5)</option>
                        </optgroup>
                        <optgroup label="Priority Tier 6 (Urgency W-6)">
                            <option value="Reactivation">Reactivation (W-6)</option>
                            <option value="Form 137A (F137A)">Form 137A (F137A) (W-6)</option>
                        </optgroup>
                        <optgroup label="Priority Tier 7 (Urgency W-7)">
                            <option value="Diploma / Duplicate Diploma">Diploma / Duplicate Diploma (W-7)</option>
                        </optgroup>
                        <optgroup label="Priority Tier 8 (Urgency W-8)">
                            <option value="Profile Update / Correction of Information">Profile Update / Correction of Information (W-8)</option>
                        </optgroup>
                        <optgroup label="Priority Tier 9 (Urgency W-9)">
                            <option value="General Inquiry">General Inquiry (W-9)</option>
                        </optgroup>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Academic Year Level</label>
                    <select name="grade_level" class="form-select" required>
                        <option value="Graduating Senior">Graduating Senior (Standing W-1)</option>
                        <option value="Senior (Non-Graduating)">Senior (Non-Graduating) (Standing W-3)</option>
                        <option value="Junior">Junior (Standing W-5)</option>
                        <option value="Sophomore">Sophomore (Standing W-7)</option>
                        <option value="Freshman">Freshman (Standing W-9)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-mapua-cardinal w-100 py-3 fw-bold shadow-sm">
                    Submit Check-In &amp; Issue Ticket
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
