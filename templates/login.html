<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapuaQ - Sign In</title>
    <link rel="icon" type="image/svg+xml" href="/static/images/logo_icon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #262729;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 30px 24px;
        }
        .login-logo {
            max-height: 85px;
            width: auto;
        }
        .form-label-custom {
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 8px;
            display: block;
        }
        .underline-input {
            background-color: transparent !important;
            border: none !important;
            border-bottom: 2px solid #ffffff !important;
            border-radius: 0 !important;
            color: #ffffff !important;
            padding: 8px 0 !important;
            font-size: 1rem;
            box-shadow: none !important;
            width: 100%;
        }
        .underline-input:focus {
            border-bottom-color: #cc0000 !important;
            outline: none !important;
        }
        .underline-input::placeholder {
            color: #777777;
        }
        .btn-signin-outline {
            background: transparent;
            border: 2px solid #ffffff;
            color: #ffffff;
            border-radius: 0;
            padding: 10px 0;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            width: 100%;
            transition: all 0.2s ease;
        }
        .btn-signin-outline:hover, .btn-signin-outline:focus {
            background-color: #ffffff;
            color: #1a1a1a;
            border-color: #ffffff;
        }
        .forgot-pass-link {
            color: #e0e0e0;
            font-size: 0.85rem;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .forgot-pass-link:hover {
            color: #ffffff;
            text-decoration: underline;
        }
        .seeded-box {
            background-color: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="text-center mb-4">
        <img src="/static/images/mapua_thinker_transparent.png" alt="Mapúa Thinker Emblem" class="img-fluid mb-3" style="max-height: 140px; width: auto; filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.6));">
        <div>
            <img src="/static/images/logo_full_white.svg" alt="MapúaQ Logo" class="login-logo mb-2">
        </div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show small py-2 mb-4" role="alert" style="background-color: #382424; border-color: #800000; color: #ffcccc;">
            {{ message }}
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/login" class="mb-4">
        <div class="mb-4">
            <label for="identifier" class="form-label-custom">Username / Account ID</label>
            <input type="text" id="identifier" name="identifier" class="form-control underline-input" autocomplete="username" required autofocus>
        </div>

        <div class="mb-5">
            <label for="password" class="form-label-custom">Password</label>
            <input type="password" id="password" name="password" class="form-control underline-input" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-signin-outline mb-2">
            Sign In
        </button>

        <div class="text-end">
            <a href="/forgot-password" class="forgot-pass-link">Forgot Password?</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
